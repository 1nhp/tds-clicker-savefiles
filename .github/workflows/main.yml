name: Save Upload

on:
  repository_dispatch:
    types: [upload_save]

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write save file
        run: |
          echo "${{ github.event.client_payload.content }}" | base64 -d > savegame.json

      - name: Commit changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add savegame.json
          git commit -m "Update save"
          git push
